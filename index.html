<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CITA Drive">
  <meta name="theme-color" content="#0d0e1b">
  <title>CITA Drive Tracker</title>
  <link rel="apple-touch-icon" href="0. CITA - Logo (o).png">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; 
      padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px) 16px;
      /* 🌟 Deep Cyberpunk Gradient Background */
      background: linear-gradient(160deg, #0d0e1b 0%, #1a103c 40%, #0b132b 100%);
      background-attachment: fixed;
      color: #f8fafc;
      display: flex; 
      flex-direction: column; 
      min-height: 100vh; 
      justify-content: flex-start;
    }

    .header { text-align: center; margin-top: 6px; margin-bottom: 12px; }
    
    /* 🔥 Neon Ring Logo Style */
    .app-logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 8px;
      background: #ffffff;
      border-radius: 50%;
      padding: 6px;
      border: 3px solid #f97316;
      box-shadow: 0 0 20px rgba(249, 115, 22, 0.6), inset 0 0 10px rgba(0,0,0,0.1);
    }

    .header h1 { 
      font-size: 24px; 
      color: #f97316; 
      margin: 0 0 2px 0; 
      font-weight: 800; 
      letter-spacing: 0.5px;
      text-shadow: 0 2px 12px rgba(249, 115, 22, 0.4);
    }
    .header p { font-size: 12px; color: #a5b4fc; margin: 0; font-weight: 500; }
    
    /* 💎 Modern Glassmorphic Card */
    .card {
      background: rgba(22, 27, 46, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 18px 16px; 
      border: 1px solid rgba(165, 180, 252, 0.15);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      margin-bottom: 12px;
    }

    .user-banner {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(13, 14, 27, 0.8); 
      padding: 10px 14px; 
      border-radius: 12px; 
      border: 1px solid rgba(56, 189, 248, 0.25);
      margin-bottom: 14px;
    }
    .user-info { font-size: 13px; color: #38bdf8; font-weight: 700; }
    .btn-edit { background: #334155; color: #cbd5e1; border: none; padding: 6px 10px; border-radius: 8px; font-size: 11px; cursor: pointer; }

    .gps-status {
      font-size: 11px; color: #facc15; text-align: center; margin-bottom: 12px;
      background: rgba(250, 204, 21, 0.12); padding: 7px; border-radius: 8px;
      border: 1px solid rgba(250, 204, 21, 0.2);
    }

    .trip-summary-box {
      background: rgba(13, 14, 27, 0.85); 
      border: 1px solid rgba(56, 189, 248, 0.35); 
      border-radius: 12px;
      padding: 12px; margin-bottom: 14px; font-size: 13px; line-height: 1.6;
    }

    .auto-km-info { font-size: 11px; color: #38bdf8; margin-top: 4px; font-weight: 500; }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 5px; font-weight: 600; }
    
    input, select {
      width: 100%; padding: 12px; border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15); 
      background: rgba(13, 14, 27, 0.8); 
      color: #ffffff;
      font-size: 15px; outline: none; transition: 0.2s;
    }
    input:focus, select:focus { 
      border-color: #f97316; 
      box-shadow: 0 0 12px rgba(249, 115, 22, 0.4); 
    }
    input:read-only { 
      background: rgba(30, 41, 59, 0.9); 
      color: #38bdf8; 
      font-weight: bold; 
      border-color: rgba(56, 189, 248, 0.3); 
    }
    
    button.btn-primary {
      width: 100%; padding: 15px; margin-top: 8px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #ea580c, #f97316);
      color: white; font-size: 16px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 18px rgba(249, 115, 22, 0.45);
    }
    button.btn-danger {
      width: 100%; padding: 12px; margin-top: 8px; border-radius: 12px; border: none;
      background: rgba(239, 68, 68, 0.85); color: white; font-size: 14px; font-weight: 600; cursor: pointer;
      backdrop-filter: blur(4px);
    }
    button:active { transform: scale(0.98); }
    button:disabled { background: #475569; opacity: 0.6; box-shadow: none; }

    /* បិទតែទំព័រ Start និង End ប៉ុណ្ណោះ ទុកទំព័រដំបូងឱ្យទាញចេញជានិច្ច */
    #startTripView, #endTripView { display: none; }
  </style>
</head>
<body>

  <div class="header">
    <img src="0. CITA - Logo (o).png" alt="CITA Logo" class="app-logo" onerror="this.style.display='none';">
    <h1>🚘 CITA Drive</h1>
    <p>ប្រព័ន្ធកត់ត្រាកុងទ័រកងយានយន្ត</p>
  </div>

  <!-- 1. ទំព័រ Register អ្នកប្រើប្រាស់ -->
  <div id="userRegisterView" class="card">
    <h3 style="margin-top:0; color:#f97316; font-size:16px; text-align:center;">👤 ចុះឈ្មោះអ្នកប្រើប្រាស់ (លើកដំបូង)</h3>
    <div class="form-group">
      <label>ឈ្មោះអ្នកបើកបរ (User Name)</label>
      <input type="text" id="regDriverName" placeholder="ឧ. សុខ ជា">
    </div>
    <button class="btn-primary" onclick="registerUser()">រក្សាទុកឈ្មោះអ្នកប្រើប្រាស់</button>
  </div>

  <!-- 2. ទំព័រ START (ពេលចេញដំណើរ) -->
  <div id="startTripView" class="card">
    <div class="user-banner">
      <div class="user-info" id="displayUserStart">👤 អ្នកប្រើប្រាស់: -</div>
      <button class="btn-edit" onclick="resetUser()">ប្តូរ User</button>
    </div>

    <div class="gps-status" id="gpsStatusStart">📍 កំពុងចាប់ទីតាំង GPS...</div>

    <div class="form-group">
      <label>🚘 ជ្រើសរើសប្រភេทยានយន្ត</label>
      <select id="vehicleSelect" onchange="fetchLastKm()">
        <option value="Honda Wave 1MP-9952">🛵 Honda Wave 1MP-9952 (ម៉ូតូ)</option>
        <option value="KIA 2AQ-4141">🚘 KIA 2AQ-4141 (ឡាន)</option>
        <option value="Ford 2CJ-7348">🚘 Ford 2CJ-7348 (ឡាន)</option>
        <option value="Ford 2CJ-3946">🚘 Ford 2CJ-3946 (ឡាន)</option>
      </select>
    </div>

    <div class="form-group">
      <label>🎯 គោលបំណងធ្វើដំណើរ (Purpose)</label>
      <input type="text" id="purpose" placeholder="ឧ. ចុះបេសកកម្ម / ដឹកទំនិញ">
    </div>

    <div class="form-group">
      <label>▶️ កុងទ័រដើម (Start KM)</label>
      <input type="number" id="startKm" placeholder="0">
      <div class="auto-km-info" id="startKmNotice">🔄 កំពុងទាញពី Sheet...</div>
    </div>

    <button class="btn-primary" onclick="startTrip()">▶️ ចាប់ផ្តើមដំណើរ (START TRIP)</button>
    <div id="statusStart" style="margin-top:10px; text-align:center; font-size:13px; color:#ef4444; font-weight:bold;"></div>
  </div>

  <!-- 3. ទំព័រ END (ពេលមកដល់វិញ) -->
  <div id="endTripView" class="card">
    <div class="user-banner">
      <div class="user-info" id="displayUserEnd">👤 អ្នកប្រើប្រាស់: -</div>
    </div>

    <div class="gps-status" id="gpsStatusEnd">📍 កំពុងចាប់ទីតាំង GPS...</div>

    <div class="trip-summary-box">
      <div style="color:#38bdf8; font-weight:bold; margin-bottom:4px;">🔴 កំពុងធ្វើដំណើរ (Trip in Progress)</div>
      <div>🚘 យានយន្ត: <b id="sumVehicle" style="color:#f97316;">-</b></div>
      <div>🎯 គោលបំណង: <b id="sumPurpose">-</b></div>
      <div>▶️ កុងទ័រដើម: <b id="sumStartKm" style="color:#4ade80;">-</b> KM</div>
      <div>⏱️ ម៉ោងចេញដំណើរ: <b id="sumStartTime">-</b></div>
    </div>

    <div class="form-group">
      <label>⏹️ កុងទ័របញ្ចប់ (End KM)</label>
      <input type="number" id="endKm" placeholder="0">
    </div>

    <div class="form-group">
      <label>⛽ បរិមាណចាក់សាំង/លីត្រ (បើមាន)</label>
      <input type="number" id="fuelLitres" placeholder="ឧ. 15 (ទុកទទេបើគ្មាន)">
    </div>

    <button id="saveBtn" class="btn-primary" onclick="endTrip()">⏹️ បញ្ចប់ដំណើរ & រក្សាទុក (END TRIP)</button>
    <button class="btn-danger" onclick="cancelTrip()">❌ បោះបង់ការធ្វើដំណើរនេះ</button>
    <div id="statusEnd" style="margin-top:10px; text-align:center; font-size:13px; font-weight:bold;"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJFzQa_hG5kbsnqfnne-P1tztc-uaOIwq5uGLeQ671yHgs5qg5dnRi16KsT6VnWqFU/exec";
    let currentLocation = "មិនទាន់ចាប់បានទីតាំង";

    function getSafe(key) {
      try { return localStorage.getItem(key); } catch(e) { return null; }
    }
    function setSafe(key, val) {
      try { localStorage.setItem(key, val); } catch(e) {}
    }
    function removeSafe(key) {
      try { localStorage.removeItem(key); } catch(e) {}
    }

    function checkAppStatus() {
      try {
        const savedUser = getSafe('cita_user_driver');
        const activeTrip = getSafe('cita_active_trip');

        if (!savedUser) {
          showView('userRegisterView');
          return;
        }

        if (activeTrip) {
          const tripData = JSON.parse(activeTrip);
          document.getElementById('displayUserEnd').innerText = "👤 អ្នកប្រើប្រាស់: " + savedUser;
          document.getElementById('sumVehicle').innerText = tripData.vehicle;
          document.getElementById('sumPurpose').innerText = tripData.purpose;
          document.getElementById('sumStartKm').innerText = tripData.startKm;
          document.getElementById('sumStartTime').innerText = tripData.startTime;
          showView('endTripView');
        } else {
          document.getElementById('displayUserStart').innerText = "👤 អ្នកប្រើប្រាស់: " + savedUser;
          showView('startTripView');
          fetchLastKm();
        }
      } catch(err) {
        showView('userRegisterView');
      }
    }

    function showView(viewId) {
      const v1 = document.getElementById('userRegisterView');
      const v2 = document.getElementById('startTripView');
      const v3 = document.getElementById('endTripView');
      if (v1) v1.style.display = 'none';
      if (v2) v2.style.display = 'none';
      if (v3) v3.style.display = 'none';
      const target = document.getElementById(viewId);
      if (target) target.style.display = 'block';
    }

    function registerUser() {
      const input = document.getElementById('regDriverName');
      if (!input) return;
      const name = input.value.trim();
      if (!name) { alert("សូមបញ្ចូលឈ្មោះ!"); return; }
      setSafe('cita_user_driver', name);
      checkAppStatus();
    }

    function resetUser() {
      if (confirm("តើអ្នកចង់ប្តូរឈ្មោះអ្នកប្រើប្រាស់មែនទេ?")) {
        removeSafe('cita_user_driver');
        checkAppStatus();
      }
    }

    function fetchLastKm() {
      const select = document.getElementById('vehicleSelect');
      if (!select) return;
      const vehicle = select.value;
      const startKmInput = document.getElementById('startKm');
      const notice = document.getElementById('startKmNotice');

      if (notice) notice.innerText = "⏳ កំពុងទាញពី Sheet...";
      if (startKmInput) {
        startKmInput.value = "";
        startKmInput.readOnly = false;
      }

      fetch(`${SCRIPT_URL}?action=getLastKm&vehicle=${encodeURIComponent(vehicle)}`)
        .then(res => res.json())
        .then(data => {
          if (data && data.lastKm !== null && data.lastKm !== undefined) {
            if (startKmInput) {
              startKmInput.value = data.lastKm;
              startKmInput.readOnly = true;
            }
            if (notice) {
              notice.innerText = "✅ ទាញស្វ័យប្រវត្តិពី Sheet";
              notice.style.color = "#4ade80";
            }
          } else {
            if (notice) {
              notice.innerText = "💡 គ្មានទិន្នន័យចាស់ទេ (សូមវាយបញ្ចូលកុងទ័រដើមដំបូង)";
              notice.style.color = "#facc15";
            }
            if (startKmInput) startKmInput.readOnly = false;
          }
        })
        .catch(err => {
          if (notice) {
            notice.innerText = "⚠️ ពុំអាចទាញទិន្នន័យបានទេ
