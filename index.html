<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CITA Drive">
  <meta name="theme-color" content="#0d0e1b">
  <title>CITA Drive Tracker</title>
  <link rel="apple-touch-icon" href="0. CITA - Logo (o).png">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; 
      padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px) 16px;
      background: linear-gradient(160deg, #0d0e1b 0%, #1a103c 40%, #0b132b 100%);
      background-attachment: fixed;
      color: #f8fafc;
      display: flex; 
      flex-direction: column; 
      min-height: 100vh; 
      justify-content: space-between;
    }

    /* 🌟 Header Flex Container (Logo ខាងឆ្វេង | User ខាងស្តាំ) */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      margin-bottom: 16px;
      gap: 10px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .app-logo {
      width: 55px;
      height: 55px;
      object-fit: contain;
    }

    .header-titles h1 { 
      font-size: 18px; 
      color: #f97316; 
      margin: 0; 
      font-weight: 800; 
      letter-spacing: 0.5px;
      text-shadow: 0 2px 10px rgba(249, 115, 22, 0.4);
    }
    .header-titles p { 
      font-size: 11px; 
      color: #a5b4fc; 
      margin: 2px 0 0 0; 
      font-weight: 500; 
    }

    /* 👤 User Box នៅខាងស្តាំ */
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(13, 14, 27, 0.85);
      padding: 6px 10px;
      border-radius: 12px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      height: 55px;
    }

    .user-info-header {
      font-size: 12px;
      color: #38bdf8;
      font-weight: 700;
      white-space: nowrap;
    }

    .btn-edit-header {
      background: #334155;
      color: #cbd5e1;
      border: none;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    
    /* Card Container */
    .card {
      background: rgba(22, 27, 46, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 18px;
      padding: 18px 16px; 
      border: 1px solid rgba(165, 180, 252, 0.15);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      margin-bottom: 12px;
    }

    .trip-summary-box {
      background: rgba(13, 14, 27, 0.9); 
      border: 1px solid rgba(56, 189, 248, 0.3); 
      border-radius: 12px;
      padding: 12px 14px; margin-bottom: 14px; font-size: 13px; line-height: 1.7;
    }

    .auto-km-info { font-size: 11px; color: #38bdf8; margin-top: 5px; font-weight: 500; }

    /* Form Layout Standardized */
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 6px; font-weight: 600; }
    
    input, select {
      width: 100%; 
      height: 48px;
      padding: 0 14px; 
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15); 
      background: rgba(13, 14, 27, 0.85); 
      color: #ffffff;
      font-size: 14px; 
      outline: none; 
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    input:focus, select:focus { 
      border-color: #f97316; 
      box-shadow: 0 0 12px rgba(249, 115, 22, 0.35); 
    }
    input:read-only { 
      background: rgba(30, 41, 59, 0.85); 
      color: #38bdf8; 
      font-weight: 700; 
      border-color: rgba(56, 189, 248, 0.3); 
    }
    
    button.btn-primary {
      width: 100%; 
      height: 50px; 
      margin-top: 6px; 
      border-radius: 12px; 
      border: none;
      background: linear-gradient(135deg, #ea580c, #f97316);
      color: white; 
      font-size: 15px; 
      font-weight: 700; 
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(249, 115, 22, 0.4);
    }
    button:active { transform: scale(0.98); }
    button:disabled { background: #475569; opacity: 0.6; box-shadow: none; }

    #userRegisterView, #startTripView, #endTripView { display: none; }
  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="top-header">
    <div class="header-left">
      <img src="0. CITA - Logo (o).png" alt="CITA Logo" class="app-logo" onerror="this.style.display='none';">
      <div class="header-titles">
        <h1>CITA Drive</h1>
        <p>ប្រព័ន្ធកត់ត្រាកុងទ័រកងយានយន្ត</p>
      </div>
    </div>
    <div class="header-right" id="userHeaderBox" style="display: none;">
      <div class="user-info-header" id="displayUserHeader">👤 -</div>
      <button class="btn-edit-header" onclick="resetUser()">ប្តូរ</button>
    </div>
  </div>

  <!-- 1. ទំព័រ Register អ្នកប្រើប្រាស់ -->
  <div id="userRegisterView" class="card">
    <h3 style="margin-top:0; color:#f97316; font-size:15px; text-align:center;">👤 ចុះឈ្មោះអ្នកប្រើប្រាស់ (លើកដំបូង)</h3>
    <div class="form-group">
      <label>ឈ្មោះអ្នកបើកបរ (User Name)</label>
      <input type="text" id="regDriverName" placeholder="ឧ. សុខ ជា">
    </div>
    <button class="btn-primary" onclick="registerUser()">រក្សាទុកឈ្មោះអ្នកប្រើប្រាស់</button>
  </div>

  <!-- 2. ទំព័រ START (ពេលចេញដំណើរ) -->
  <div id="startTripView" class="card">
    <div class="form-group">
      <label>🚘 ជ្រើសរើសប្រភេทยានយន្ត</label>
      <select id="vehicleSelect" onchange="fetchLastKm()">
        <option value="Ford 2CJ-3946">🚘 Ford 2CJ-3946 (ឡាន)</option>
        <option value="Ford 2CJ-7348">🚘 Ford 2CJ-7348 (ឡាន)</option>
        <option value="KIA 2AQ-4141">🚘 KIA 2AQ-4141 (ឡាន)</option>
        <option value="Honda Wave 1MP-9952">🛵 Honda Wave 1MP-9952 (ម៉ូតូ)</option>
      </select>
    </div>

    <div class="form-group">
      <label>🎯 គោលបំណងធ្វើដំណើរ (Purpose)</label>
      <input type="text" id="purpose" placeholder="ឧ. ចុះបេសកកម្ម / ដឹកទំនិញ">
    </div>

    <div class="form-group">
      <label>▶️ កុងទ័រដើម (Start KM)</label>
      <input type="number" id="startKm" placeholder="0">
      <div class="auto-km-info" id="startKmNotice">🔄 កំពុងទាញពី Sheet...</div>
    </div>

    <button class="btn-primary" onclick="startTrip()">▶️ ចាប់ផ្តើមដំណើរ (START TRIP)</button>
    <div id="statusStart" style="margin-top:10px; text-align:center; font-size:13px; color:#ef4444; font-weight:bold;"></div>
  </div>

  <!-- 3. ទំព័រ END (ពេលមកដល់វិញ) -->
  <div id="endTripView" class="card">
    <div class="trip-summary-box">
      <div style="color:#38bdf8; font-weight:bold; margin-bottom:4px;">🔴 កំពុងធ្វើដំណើរ (Trip in Progress)</div>
      <div>🚘 យានយន្ត: <b id="sumVehicle" style="color:#f97316;">-</b></div>
      <div>🎯 គោលបំណង: <b id="sumPurpose">-</b></div>
      <div>▶️ កុងទ័រដើម: <b id="sumStartKm" style="color:#4ade80;">-</b> KM</div>
      <div>⏱️ ម៉ោងចេញដំណើរ: <b id="sumStartTime">-</b></div>
    </div>

    <div class="form-group">
      <label>⏹️ កុងទ័របញ្ចប់ (End KM)</label>
      <input type="number" id="endKm" placeholder="0">
    </div>

    <div class="form-group">
      <label>⛽ ចំនួនទឹកប្រាក់ចាក់សាំង (បើមាន)</label>
      <input type="text" id="fuelAmount" placeholder="ឧ. 10$ ឬ 40000៛ (ទុកទទេបើគ្មាន)">
    </div>

    <button id="saveBtn" class="btn-primary" onclick="endTrip()">⏹️ បញ្ចប់ដំណើរ & រក្សាទុក (END TRIP)</button>
    <div id="statusEnd" style="margin-top:10px; text-align:center; font-size:13px; font-weight:bold;"></div>
  </div>

  <script>
    // ⚠️ ជំនួស Web App Link របស់ Google Apps Script ត្រង់នេះ
    const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

    window.onload = function() {
      checkAppStatus();
    };

    function checkAppStatus() {
      const savedUser = localStorage.getItem('cita_user_driver');
      const activeTrip = localStorage.getItem('cita_active_trip');
      const headerUserBox = document.getElementById('userHeaderBox');
      const displayUserHeader = document.getElementById('displayUserHeader');

      if (!savedUser) {
        headerUserBox.style.display = 'none';
        showView('userRegisterView');
        return;
      }

      displayUserHeader.innerText = "👤 " + savedUser;
      headerUserBox.style.display = 'flex';

      if (activeTrip) {
        const tripData = JSON.parse(activeTrip);
        document.getElementById('sumVehicle').innerText = tripData.vehicle;
        document.getElementById('sumPurpose').innerText = tripData.purpose;
        document.getElementById('sumStartKm').innerText = tripData.startKm;
        document.getElementById('sumStartTime').innerText = tripData.startTime;
        showView('endTripView');
      } else {
        showView('startTripView');
        fetchLastKm();
      }
    }

    function showView(viewId) {
      document.getElementById('userRegisterView').style.display = 'none';
      document.getElementById('startTripView').style.display = 'none';
      document.getElementById('endTripView').style.display = 'none';
      document.getElementById(viewId).style.display = 'block';
    }

    function registerUser() {
      const name = document.getElementById('regDriverName').value.trim();
      if (!name) { alert("សូមបញ្ចូលឈ្មោះ!"); return; }
      localStorage.setItem('cita_user_driver', name);
      checkAppStatus();
    }

    function resetUser() {
      if (confirm("តើអ្នកចង់ប្តូរឈ្មោះអ្នកប្រើប្រាស់មែនទេ?")) {
        localStorage.removeItem('cita_user_driver');
        checkAppStatus();
      }
    }

    function fetchLastKm() {
      const vehicle = document.getElementById('vehicleSelect').value;
      const startKmInput = document.getElementById('startKm');
      const notice = document.getElementById('startKmNotice');

      notice.innerText = "⏳ កំពុងទាញពី Sheet...";
      startKmInput.value = "";
      startKmInput.readOnly = false;

      fetch(`${SCRIPT_URL}?action=getLastKm&vehicle=${encodeURIComponent(vehicle)}`)
        .then(res => res.json())
        .then(data => {
          if (data && data.lastKm !== null && data.lastKm !== undefined) {
            startKmInput.value = data.lastKm;
            startKmInput.readOnly = true;
            notice.innerText = "✅ ទាញស្វ័យប្រវត្តិពី Sheet";
            notice.style.color = "#4ade80";
          } else {
            notice.innerText = "💡 គ្មានទិន្នន័យចាស់ទេ (សូមវាយបញ្ចូលកុងទ័រដើមដំបូង)";
            notice.style.color = "#facc15";
            startKmInput.readOnly = false;
          }
        })
        .catch(err => {
          notice.innerText = "⚠️ ពុំអាចទាញទិន្នន័យបាន (អាចវាយបញ្ចូលដោយដៃ)";
          notice.style.color = "#ef4444";
          startKmInput.readOnly = false;
        });
    }

    function startTrip() {
      const vehicle = document.getElementById('vehicleSelect').value;
      const purpose = document.getElementById('purpose').value.trim();
      const startKm = document.getElementById('startKm').value;
      const statusErr = document.getElementById('statusStart');

      if (!purpose || !startKm) {
        statusErr.innerText = "⚠️ សូមបញ្ចូល គោលបំណង និង កុងទ័រដើម!";
        return;
      }

      const now = new Date();
      const timeStr = now.toLocaleTimeString('km-KH', { hour12: false });

      const tripData = {
        vehicle: vehicle,
        purpose: purpose,
        startKm: startKm,
        startTime: timeStr
      };

      localStorage.setItem('cita_active_trip', JSON.stringify(tripData));
      document.getElementById('purpose').value = '';
      statusErr.innerText = '';
      checkAppStatus();
    }

    function endTrip() {
      const activeTrip = JSON.parse(localStorage.getItem('cita_active_trip'));
      const endKm = document.getElementById('endKm').value;
      const fuelAmount = document.getElementById('fuelAmount').value.trim();
      const status = document.getElementById('statusEnd');
      const btn = document.getElementById('saveBtn');

      if (!endKm) {
        status.style.color = '#ef4444';
        status.innerText = "⚠️ សូមបញ្ចូលកុងទ័របញ្ចប់!";
        return;
      }

      if (Number(endKm) < Number(activeTrip.startKm)) {
        status.style.color = '#ef4444';
        status.innerText = "⚠️ កុងទ័របញ្ចប់ មិនអាចតូចជាងកុងទ័រដើមទេ!";
        return;
      }

      btn.disabled = true;
      status.style.color = '#38bdf8';
      status.innerText = "⏳ កំពុងផ្ញើទិន្នន័យចូល Sheet...";

      const payload = {
        driver: localStorage.getItem('cita_user_driver'),
        vehicle: activeTrip.vehicle,
        purpose: activeTrip.purpose,
        startKm: activeTrip.startKm,
        endKm: endKm,
        startTime: activeTrip.startTime,
        fuelLitres: fuelAmount || "0"
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        status.style.color = '#4ade80';
        status.innerText = "✅ រក្សាទុកទិន្នន័យចូល Sheet ជោគជ័យ!";
        localStorage.removeItem('cita_active_trip');
        setTimeout(() => {
          btn.disabled = false;
          document.getElementById('endKm').value = '';
          document.getElementById('fuelAmount').value = '';
          status.innerText = '';
          checkAppStatus();
        }, 1500);
      })
      .catch(err => {
        status.style.color = '#ef4444';
        status.innerText = "❌ មានបញ្ហា ព្យាយាមម្តងទៀត";
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
