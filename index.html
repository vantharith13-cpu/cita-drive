<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CITA Drive">
  <meta name="theme-color" content="#090d16">
  <title>CITA Drive Tracker</title>
  <link rel="apple-touch-icon" href="0. CITA - Logo (o).png">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; 
      padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px) 16px;
      /* 🌟 Ambient Tech Glow Background */
      background-color: #080c14;
      background-image: 
        radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.22) 0px, transparent 45%),
        radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.18) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.6) 0px, transparent 100%);
      background-attachment: fixed;
      color: #f8fafc;
      display: flex; 
      flex-direction: column; 
      min-height: 100vh; 
      justify-content: space-between;
    }

    .header { text-align: center; margin-top: 6px; margin-bottom: 12px; }
    
    .app-logo {
      width: 85px;
      height: 85px;
      object-fit: contain;
      margin-bottom: 8px;
      background: #ffffff;
      border-radius: 50%;
      padding: 6px;
      box-shadow: 0 4px 20px rgba(249, 115, 22, 0.35);
    }

    .header h1 { 
      font-size: 24px; 
      color: #f97316; 
      margin: 0 0 2px 0; 
      font-weight: 800; 
      letter-spacing: 0.5px;
      text-shadow: 0 2px 10px rgba(249, 115, 22, 0.3);
    }
    .header p { font-size: 12px; color: #94a3b8; margin: 0; font-weight: 500; }
    
    /* 💎 Glassmorphic Card Style */
    .card {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 18px 16px; 
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.6);
      margin-bottom: 12px;
    }

    .user-banner {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(15, 23, 42, 0.7); 
      padding: 10px 14px; 
      border-radius: 12px; 
      border: 1px solid rgba(56, 189, 248, 0.2);
      margin-bottom: 14px;
    }
    .user-info { font-size: 13px; color: #38bdf8; font-weight: 700; }
    .btn-edit { background: #334155; color: #cbd5e1; border: none; padding: 6px 10px; border-radius: 8px; font-size: 11px; cursor: pointer; }

    .gps-status {
      font-size: 11px; color: #facc15; text-align: center; margin-bottom: 12px;
      background: rgba(250, 204, 21, 0.12); padding: 7px; border-radius: 8px;
      border: 1px solid rgba(250, 204, 21, 0.2);
    }

    .trip-summary-box {
      background: rgba(15, 23, 42, 0.8); 
      border: 1px solid rgba(56, 189, 248, 0.3); 
      border-radius: 12px;
      padding: 12px; margin-bottom: 14px; font-size: 13px; line-height: 1.6;
    }

    .auto-km-info { font-size: 11px; color: #38bdf8; margin-top: 4px; font-weight: 500; }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 5px; font-weight: 600; }
    
    input, select {
      width: 100%; padding: 12px; border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15); 
      background: rgba(15, 23, 42, 0.75); 
      color: #ffffff;
      font-size: 15px; outline: none; transition: 0.2s;
    }
    input:focus, select:focus { 
      border-color: #f97316; 
      box-shadow: 0 0 12px rgba(249, 115, 22, 0.35); 
    }
    input:read-only { 
      background: rgba(30, 41, 59, 0.9); 
      color: #38bdf8; 
      font-weight: bold; 
      border-color: rgba(56, 189, 248, 0.3); 
    }
    
    button.btn-primary {
      width: 100%; padding: 15px; margin-top: 8px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #ea580c, #f97316);
      color: white; font-size: 16px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
    }
    button.btn-danger {
      width: 100%; padding: 12px; margin-top: 8px; border-radius: 12px; border: none;
      background: rgba(239, 68, 68, 0.85); color: white; font-size: 14px; font-weight: 600; cursor: pointer;
      backdrop-filter: blur(4px);
    }
    button:active { transform: scale(0.98); }
    button:disabled { background: #475569; opacity: 0.6; box-shadow: none; }

    #userRegisterView, #startTripView, #endTripView { display: none; }
  </style>
</head>
<body>

  <div class="header">
    <img src="0. CITA - Logo (o).png" alt="CITA Logo" class="app-logo" onerror="this.style.display='none';">
    <h1>🚘 CITA Drive</h1>
    <p>ប្រព័ន្ធកត់ត្រាកុងទ័រកងយានយន្ត</p>
  </div>

  <!-- 1. ទំព័រ Register អ្នកប្រើប្រាស់ -->
  <div id="userRegisterView" class="card">
    <h3 style="margin-top:0; color:#f97316; font-size:16px; text-align:center;">👤 ចុះឈ្មោះអ្នកប្រើប្រាស់ (លើកដំបូង)</h3>
    <div class="form-group">
      <label>ឈ្មោះអ្នកបើកបរ (User Name)</label>
      <input type="text" id="regDriverName" placeholder="ឧ. សុខ ជា">
    </div>
    <button class="btn-primary" onclick="registerUser()">រក្សាទុកឈ្មោះអ្នកប្រើប្រាស់</button>
  </div>

  <!-- 2. ទំព័រ START (ពេលចេញដំណើរ) -->
  <div id="startTripView" class="card">
    <div class="user-banner">
      <div class="user-info" id="displayUserStart">👤 អ្នកប្រើប្រាស់: -</div>
      <button class="btn-edit" onclick="resetUser()">ប្តូរ User</button>
    </div>

    <div class="gps-status" id="gpsStatusStart">📍 កំពុងចាប់ទីតាំង GPS...</div>

    <div class="form-group">
      <label>🚘 ជ្រើសរើសប្រភេทยានយន្ត</label>
      <select id="vehicleSelect" onchange="fetchLastKm()">
        <option value="Honda Wave 1MP-9952">🛵 Honda Wave 1MP-9952 (ម៉ូតូ)</option>
        <option value="KIA 2AQ-4141">🚘 KIA 2AQ-4141 (ឡាន)</option>
        <option value="Ford 2CJ-7348">🚘 Ford 2CJ-7348 (ឡាន)</option>
        <option value="Ford 2CJ-3946">🚘 Ford 2CJ-3946 (ឡាន)</option>
      </select>
    </div>

    <div class="form-group">
      <label>🎯 គោលបំណងធ្វើដំណើរ (Purpose)</label>
      <input type="text" id="purpose" placeholder="ឧ. ចុះបេសកកម្ម / ដឹកទំនិញ">
    </div>
