<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CITA Drive">
  <meta name="theme-color" content="#0f172a">
  <title>CITA Drive Tracker</title>
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3202/3202926.png">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px) 16px;
      background-color: #0f172a; color: #f8fafc;
      display: flex; flex-direction: column; min-height: 100vh; justify-content: space-between;
    }
    .header { text-align: center; margin-top: 6px; margin-bottom: 12px; }
    .header h1 { font-size: 22px; color: #f97316; margin: 0 0 2px 0; font-weight: 800; }
    .header p { font-size: 12px; color: #94a3b8; margin: 0; }
    
    .card {
      background: #1e293b; border-radius: 20px;
      padding: 18px 16px; border: 1px solid #334155;
      box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.5);
      margin-bottom: 12px;
    }

    .user-banner {
      display: flex; justify-content: space-between; align-items: center;
      background: #0f172a; padding: 10px 14px; border-radius: 12px; border: 1px solid #334155;
      margin-bottom: 14px;
    }
    .user-info { font-size: 13px; color: #38bdf8; font-weight: 700; }
    .btn-edit { background: #334155; color: #cbd5e1; border: none; padding: 6px 10px; border-radius: 8px; font-size: 11px; cursor: pointer; }

    .gps-status {
      font-size: 11px; color: #facc15; text-align: center; margin-bottom: 12px;
      background: rgba(250, 204, 21, 0.1); padding: 6px; border-radius: 8px;
    }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 4px; font-weight: 600; }
    input, select {
      width: 100%; padding: 12px; border-radius: 10px;
      border: 1px solid #475569; background: #0f172a; color: #ffffff;
      font-size: 15px; outline: none; transition: 0.2s;
    }
    input:focus, select:focus { border-color: #f97316; box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.25); }
    
    button.btn-primary {
      width: 100%; padding: 15px; margin-top: 8px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #ea580c, #f97316);
      color: white; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    button:active { transform: scale(0.98); }
    button:disabled { background: #475569; opacity: 0.6; }
    #status { margin-top: 10px; text-align: center; font-size: 13px; font-weight: 600; min-height: 18px; }

    #userRegisterView { display: none; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🚘 CITA Drive</h1>
    <p>ប្រព័ន្ធកត់ត្រាកុងទ័រកងយានយន្ត</p>
  </div>

  <!-- 1. ទំព័រ Register អ្នកប្រើប្រាស់ (បង្ហាញតែលើកដំបូង) -->
  <div id="userRegisterView" class="card">
    <h3 style="margin-top:0; color:#f97316; font-size:16px; text-align:center;">👤 ចុះឈ្មោះអ្នកប្រើប្រាស់ (លើកដំបូង)</h3>
    <p style="font-size:12px; color:#94a3b8; text-align:center; margin-top:-6px;">បញ្ចូលឈ្មោះរបស់អ្នក ដើម្បីកុំឱ្យពិបាកវាយបញ្ចូលឡើងវិញពេលក្រោយ</p>
    <div class="form-group">
      <label>ឈ្មោះអ្នកបើកបរ (User Name)</label>
      <input type="text" id="regDriverName" placeholder="ឧ. សុខ ជា">
    </div>
    <button class="btn-primary" onclick="registerUser()">រក្សាទុកឈ្មោះអ្នកប្រើប្រាស់</button>
  </div>

  <!-- 2. ទំព័រកត់ត្រាទិន្នន័យ -->
  <div id="tripView" class="card" style="display:none;">
    
    <div class="user-banner">
      <div class="user-info" id="displayUser">👤 អ្នកប្រើប្រាស់: -</div>
      <button class="btn-edit" onclick="resetUser()">ប្តូរ User</button>
    </div>

    <div class="gps-status" id="gpsStatus">📍 កំពុងចាប់ទីតាំង GPS ដោយស្វ័យប្រវត្តិ...</div>

    <div class="form-group">
      <label>🚘 ជ្រើសរើសប្រភេทยានយន្ត (Vehicle)</label>
      <select id="vehicleSelect">
        <option value="Honda Wave 1MP-9952">🛵 Honda Wave 1MP-9952 (ម៉ូតូ)</option>
        <option value="KIA 2AQ-4141">🚘 KIA 2AQ-4141 (ឡាន)</option>
        <option value="Ford 2CJ-7348">🚘 Ford 2CJ-7348 (ឡាន)</option>
        <option value="Ford 2CJ-3946">🚘 Ford 2CJ-3946 (ឡាន)</option>
      </select>
    </div>

    <div class="form-group">
      <label>🎯 គោលបំណងធ្វើដំណើរ (Purpose)</label>
      <input type="text" id="purpose" placeholder="ឧ. ចុះបេសកកម្ម / ដឹកទំនិញ">
    </div>

    <div style="display:flex; gap:10px;">
      <div class="form-group" style="flex:1;">
        <label>▶️ កុងទ័រដើម (Start KM)</label>
        <input type="number" id="startKm" placeholder="0">
      </div>
      <div class="form-group" style="flex:1;">
        <label>⏹️ កុងទ័របញ្ចប់ (End KM)</label>
        <input type="number" id="endKm" placeholder="0">
      </div>
    </div>

    <div class="form-group">
      <label>⛽ បរិមាណចាក់សាំង/លីត្រ (បើមានចាក់ពេលបញ្ចប់)</label>
      <input type="number" id="fuelLitres" placeholder="ឧ. 15 (ទុកទទេបើគ្មាន)">
    </div>

    <button id="saveBtn" class="btn-primary" onclick="saveTripData()">START (កត់ត្រាទិន្នន័យ)</button>
    <div id="status"></div>
  </div>

  <script>
    // ⚠️ ប្តូរ Link Web App របស់ Google Apps Script (ដែលបញ្ចប់ដោយ /exec) ចូលត្រង់នេះ
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzuo-wwxXVGNLtjmSNgCzxXO_YNMfwvRbY2ly3X7q_JskChTaROcn2hV_wVoFqdxAl9/exec";
    let currentLocation = "មិនទាន់ចាប់បានទីតាំង";

    window.onload = function() {
      checkUserStatus();
      initGPS();
    };

    function checkUserStatus() {
      const savedUser = localStorage.getItem('cita_user_driver');
      if (savedUser) {
        document.getElementById('userRegisterView').style.display = 'none';
        document.getElementById('tripView').style.display = 'block';
        document.getElementById('displayUser').innerText = "👤 អ្នកប្រើប្រាស់: " + savedUser;
      } else {
        document.getElementById('userRegisterView').style.display = 'block';
        document.getElementById('tripView').style.display = 'none';
      }
    }

    function registerUser() {
      const name = document.getElementById('regDriverName').value.trim();
      if (!name) {
        alert("សូមបញ្ចូលឈ្មោះអ្នកប្រើប្រាស់!");
        return;
      }
      localStorage.setItem('cita_user_driver', name);
      checkUserStatus();
    }

    function resetUser() {
      if (confirm("តើអ្នកចង់ប្តូរឈ្មោះអ្នកប្រើប្រាស់មែនទេ?")) {
        localStorage.removeItem('cita_user_driver');
        checkUserStatus();
      }
    }

    function initGPS() {
      const gpsElement = document.getElementById('gpsStatus');
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude.toFixed(5);
            const lng = position.coords.longitude.toFixed(5);
            currentLocation = `${lat}, ${lng}`;
            gpsElement.style.color = '#4ade80';
            gpsElement.innerText = `📍 ទីតាំង GPS (Auto): ${currentLocation}`;
          },
          (error) => {
            gpsElement.style.color = '#f87171';
            gpsElement.innerText = "📍 ពុំអាចចាប់ទីតាំងបាន (សូមបើក Location GPS)";
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      }
    }

    function saveTripData() {
      const btn = document.getElementById('saveBtn');
      const status = document.getElementById('status');
      
      const driver = localStorage.getItem('cita_user_driver');
      const vehicle = document.getElementById('vehicleSelect').value;
      const purpose = document.getElementById('purpose').value.trim();
      const startKm = document.getElementById('startKm').value;
      const endKm = document.getElementById('endKm').value;
      const fuelLitres = document.getElementById('fuelLitres').value;

      if (!purpose || !startKm || !endKm) {
        status.style.color = '#ef4444';
        status.innerText = "⚠️ សូមបញ្ចូល គោលបំណង, កុងទ័រដើម និងកុងទ័របញ្ចប់!";
        return;
      }

      btn.disabled = true;
      status.style.color = '#38bdf8';
      status.innerText = "⏳ កំពុងផ្ញើទិន្នន័យចូល Sheet...";

      const payload = {
        driver: driver,
        vehicle: vehicle,
        purpose: purpose,
        startKm: startKm,
        endKm: endKm,
        fuelLitres: fuelLitres,
        location: currentLocation
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        status.style.color = '#4ade80';
        status.innerText = `✅ កត់ត្រាចូល Tab Sheet (${vehicle}) ជោគជ័យ!`;
        btn.disabled = false;
        document.getElementById('purpose').value = '';
        document.getElementById('startKm').value = '';
        document.getElementById('endKm').value = '';
        document.getElementById('fuelLitres').value = '';
      })
      .catch(err => {
        status.style.color = '#ef4444';
        status.innerText = "❌ មានបញ្ហា ព្យាយាមម្តងទៀត";
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
