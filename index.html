    .header { text-align: center; margin-top: 6px; margin-bottom: 12px; }
    
    /* 🔥 Neon Ring Logo Style */
    .app-logo {
      width: 90px;

      object-fit: contain;
      margin-bottom: 8px;
      background: #ffffff;
      border-radius: 50%;
      padding: 6px;

      font-weight: 800;

    }
    .header p { font-size: 12px; color: #a5b4fc; margin: 0; font-weight: 500; }

      margin-bottom: 12px;
    }
