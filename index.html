<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CITA Drive - ប្រព័ន្ធកត់ត្រាយានយន្ត</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-color: #f97316;
      --accent-hover: #ea580c;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --input-bg: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kantumruy Pro', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-color);
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      border: 1px solid var(--card-border);
    }

    .change-btn {
      color: var(--accent-color);
      cursor: pointer;
      font-size: 0.75rem;
      text-decoration: underline;
      margin-left: 4px;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Form Elements */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    input, select {
      width: 100%;
      height: 48px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0 14px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent-color);
    }

    /* Buttons */
    .btn {
      height: 48px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn:active {
      background: var(--accent-hover);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Trip Active Info Box */
    .active-info {
      background: rgba(249, 115, 22, 0.1);
      border: 1px solid rgba(249, 115, 22, 0.3);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.9rem;
    }

    .active-info-item {
      display: flex;
      justify-content: space-between;
    }

    .status-msg {
      font-size: 0.85rem;
      text-align: center;
      min-height: 20px;
    }
    .status-msg.error { color: #ef4444; }
    .status-msg.success { color: #22c55e; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="brand">
        <img src="logo.png" alt="CITA Logo" onerror="this.src='https://via.placeholder.com/40'">
        <div>
          <div class="brand-title">CITA Drive</div>
          <div class="brand-sub">ប្រព័ន្ធកត់ត្រាការប្រើប្រាស់យានយន្ត</div>
        </div>
      </div>
      <div id="userBadge" class="user-badge" style="display: none;">
        <span id="userNameDisplay">...</span>
        <span class="change-btn" onclick="resetUser()">ប្តូរ</span>
      </div>
    </header>

    <!-- 1. Form ចុះឈ្មោះអ្នកប្រើប្រាស់ (បង្ហាញតែលើកដំបូង) -->
    <div id="userCard" class="card">
      <div class="card-title">👤 ចុះឈ្មោះអ្នកប្រើប្រាស់ (លើកដំបូង)</div>
      <div class="form-group">
        <label>ឈ្មោះអ្នកបើកបរ (User Name)</label>
        <input type="text" id="userInput" placeholder="ឧ. សុខ ជា">
      </div>
      <button class="btn" onclick="saveUser()">រក្សាទុកឈ្មោះអ្នកប្រើប្រាស់</button>
    </div>

    <!-- 2. Form ចាប់ផ្តើមធ្វើដំណើរ (Start Trip) -->
    <div id="startCard" class="card" style="display: none;">
      <div class="card-title">🚘 ជ្រើសរើសប្រភេទយានយន្ត</div>
      
      <div class="form-group">
        <label>យានយន្ត</label>
        <select id="vehicleSelect" onchange="fetchLastKm()">
          <option value="Ford 2CJ-3946">Ford 2CJ-3946 (ឡាន)</option>
          <option value="Mazda 2AB-1234">Mazda 2AB-1234 (ឡាន)</option>
          <option value="Honda 1AB-5678">Honda 1AB-5678 (ម៉ូតូ)</option>
        </select>
      </div>

      <div class="form-group">
        <label>🎯 គោលបំណងធ្វើដំណើរ (Purpose)</label>
        <input type="text" id="purposeInput" placeholder="ឧ. ចុះបេសកកម្ម / ដឹកទំនិញ">
      </div>

      <div class="form-group">
        <label>▶️ កុងទ័រដើម (Start KM)</label>
        <input type="number" id="startKmInput" placeholder="0">
      </div>

      <div id="statusStart" class="status-msg"></div>

      <button class="btn" onclick="startTrip()">
        ▶️ ចាប់ផ្តើមដំណើរ (START TRIP)
      </button>
    </div>

    <!-- 3. Form បញ្ចប់ការធ្វើដំណើរ (End Trip) -->
    <div id="endCard" class="card" style="display: none;">
      <div class="card-title">🔴 កំពុងធ្វើដំណើរ (Trip in Progress)</div>
      
      <div class="active-info">
        <div class="active-info-item">
          <span style="color:var(--text-sub)">យានយន្ត:</span>
          <strong id="activeVehicle">...</strong>
        </div>
        <div class="active-info-item">
          <span style="color:var(--text-sub)">គោលបំណង:</span>
          <span id="activePurpose">...</span>
        </div>
        <div class="active-info-item">
          <span style="color:var(--text-sub)">កុងទ័រដើម:</span>
          <span><strong id="activeStartKm">0</strong> KM</span>
        </div>
        <div class="active-info-item">
          <span style="color:var(--text-sub)">ម៉ោងចេញដំណើរ:</span>
          <span id="activeStartTime">...</span>
        </div>
      </div>

      <div class="form-group">
        <label>⏹️ កុងទ័របញ្ចប់ (End KM)</label>
        <input type="number" id="endKmInput" placeholder="0">
      </div>

      <div class="form-group">
        <label>⛽ ចំនួនទឹកប្រាក់ចាក់សាំង (បើមាន)</label>
        <input type="text" id="fuelInput" placeholder="ឧ. 10$ ឬ 40000៛ (ទុកទំនេរប្រហើគ្មាន)">
      </div>

      <div id="statusEnd" class="status-msg"></div>

      <button id="endBtn" class="btn" onclick="endTrip()">
        ⏹️ បញ្ចប់ដំណើរ & រក្សាទុក (END TRIP)
      </button>
    </div>
  </div>

  <script>
    // 🔗 ដាក់ Link Google Apps Script Web App URL របស់បងត្រង់នេះ
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwEgAelzrbGZj3EzGJsAhrwpx2hIrH10gMoyPggt3g5OycamGd6_2p_e9QEARB7j8qX/exec";

    document.addEventListener("DOMContentLoaded", () => {
      checkAppStatus();
    });

    function checkAppStatus() {
      const user = localStorage.getItem("cita_user_name");
      const activeTrip = localStorage.getItem("cita_active_trip");

      const userCard = document.getElementById("userCard");
      const startCard = document.getElementById("startCard");
      const endCard = document.getElementById("endCard");
      const userBadge = document.getElementById("userBadge");

      if (!user) {
        userCard.style.display = "flex";
        startCard.style.display = "none";
        endCard.style.display = "none";
        userBadge.style.display = "none";
        return;
      }

      userBadge.style.display = "flex";
      document.getElementById("userNameDisplay").innerText = user;
      userCard.style.display = "none";

      if (activeTrip) {
        const trip = JSON.parse(activeTrip);
        document.getElementById("activeVehicle").innerText = trip.vehicle;
        document.getElementById("activePurpose").innerText = trip.purpose;
        document.getElementById("activeStartKm").innerText = trip.startKm;
        document.getElementById("activeStartTime").innerText = trip.startTime;

        startCard.style.display = "none";
        endCard.style.display = "flex";
      } else {
        startCard.style.display = "flex";
        endCard.style.display = "none";
        fetchLastKm();
      }
    }

    function saveUser() {
      const name = document.getElementById("userInput").value.trim();
      if (!name) return alert("សូមបញ្ចូលឈ្មោះរបស់អ្នក!");
      localStorage.setItem("cita_user_name", name);
      checkAppStatus();
    }

    function resetUser() {
      if (confirm("តើបងចង់ប្តូរឈ្មោះអ្នកប្រើប្រាស់មែនទេ?")) {
        localStorage.removeItem("cita_user_name");
        checkAppStatus();
      }
    }

    async function fetchLastKm() {
      const vehicle = document.getElementById("vehicleSelect").value;
      const startKmInput = document.getElementById("startKmInput");
      startKmInput.placeholder = "កំពុងទាញយកទិន្នន័យ...";
      
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getLastKm&vehicle=${encodeURIComponent(vehicle)}`);
        const data = await res.json();
        if (data && data.lastKm) {
          startKmInput.value = data.lastKm;
        } else {
          startKmInput.value = "";
          startKmInput.placeholder = "0";
        }
      } catch (e) {
        startKmInput.placeholder = "0";
      }
    }

    function startTrip() {
      const vehicle = document.getElementById("vehicleSelect").value;
      const purpose = document.getElementById("purposeInput").value.trim();
      const startKm = document.getElementById("startKmInput").value;
      const statusStart = document.getElementById("statusStart");

      if (!purpose || !startKm) {
        statusStart.className = "status-msg error";
        statusStart.innerText = "⚠️ សូមបញ្ចូល គោលបំណង និង កុងទ័រដើម!";
        return;
      }

      // កំណត់ Format ម៉ោងចេញដំណើរជា 12-hour AM/PM (ឧ. 5:43 PM)
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });

      const tripData = {
        vehicle: vehicle,
        purpose: purpose,
        startKm: startKm,
        startTime: timeStr
      };

      localStorage.setItem("cita_active_trip", JSON.stringify(tripData));
      document.getElementById("purposeInput").value = "";
      statusStart.innerText = "";
      checkAppStatus();
    }

    async function endTrip() {
      const endKm = document.getElementById("endKmInput").value;
      const fuelText = document.getElementById("fuelInput").value.trim();
      const statusEnd = document.getElementById("statusEnd");
      const endBtn = document.getElementById("endBtn");

      const activeTrip = JSON.parse(localStorage.getItem("cita_active_trip"));
      const driverName = localStorage.getItem("cita_user_name");

      if (!endKm) {
        statusEnd.className = "status-msg error";
        statusEnd.innerText = "⚠️ សូមបញ្ចូលកុងទ័របញ្ចប់!";
        return;
      }

      if (Number(endKm) < Number(activeTrip.startKm)) {
        statusEnd.className = "status-msg error";
        statusEnd.innerText = "⚠️ កុងទ័របញ្ចប់មិនអាចតូចជាងកុងទ័រដើមឡើយ!";
        return;
      }

      endBtn.disabled = true;
      statusEnd.className = "status-msg";
      statusEnd.innerText = "⏳ កំពុងផ្ញើទិន្នន័យទៅ Google Sheet...";

      const payload = {
        driver: driverName,
        vehicle: activeTrip.vehicle,
        purpose: activeTrip.purpose,
        startKm: activeTrip.startKm,
        startTime: activeTrip.startTime,
        endKm: endKm,
        fuelLitres: fuelText || "0"
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const resData = await response.json();

        if (resData.result === "success") {
          localStorage.removeItem("cita_active_trip");
          document.getElementById("endKmInput").value = "";
          document.getElementById("fuelInput").value = "";
          statusEnd.className = "status-msg success";
          statusEnd.innerText = "✅ រក្សាទុកជោគជ័យ!";
          
          setTimeout(() => {
            statusEnd.innerText = "";
            endBtn.disabled = false;
            checkAppStatus();
          }, 1200);
        } else {
          throw new Error(resData.message || " Error");
        }
      } catch (err) {
        statusEnd.className = "status-msg error";
        statusEnd.innerText = "❌ មានបញ្ហា៖ " + err.message;
        endBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
